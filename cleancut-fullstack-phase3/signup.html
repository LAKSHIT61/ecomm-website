<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign up — CleanCut</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="auth-page"><div class="auth-card"><a class="logo" href="index.html">CleanCut</a><h1>Create your account.</h1><p>Save your profile and get a faster checkout experience.</p><div id="auth-message" class="auth-message" aria-live="polite"></div><form id="signup-form"><input required minlength="2" placeholder="Full name" autocomplete="name"><input required type="email" placeholder="Email" autocomplete="email"><input required minlength="8" type="password" placeholder="Password (8+ characters)" autocomplete="new-password"><button class="btn btn-primary" type="submit">Create account</button></form><p>Already have an account? <a href="login.html"><strong>Login</strong></a></p></div></main><script src="js/auth.js"></script></body></html>
