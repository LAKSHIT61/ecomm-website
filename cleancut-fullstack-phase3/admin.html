<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanCut Admin</title><link rel="stylesheet" href="css/style.css"><style>
.admin-shell{max-width:1400px;margin:0 auto;padding:36px 24px 80px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.admin-head h1{margin:0}.admin-note{color:#6e655e}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}.metric{background:#fff;border:1px solid #e7ded7;border-radius:18px;padding:20px}.metric small{color:#786e67}.metric strong{display:block;font-size:28px;margin-top:8px}.admin-panel{background:#fff;border:1px solid #e7ded7;border-radius:20px;padding:22px;margin-bottom:24px}.admin-panel h2{margin-top:0}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.admin-tabs button{border:1px solid #ddd1c9;background:#f7f1ec;border-radius:999px;padding:10px 15px;cursor:pointer}.admin-tabs button.active{background:#171514;color:#fff}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:13px 10px;border-bottom:1px solid #eee6e0;text-align:left;font-size:14px}.admin-table th{color:#716861}.admin-table img{width:48px;height:48px;object-fit:cover;border-radius:10px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.admin-actions button,.admin-form button{background:#171514;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;box-sizing:border-box;border:1px solid #ddd1c9;border-radius:10px;padding:11px;background:#fff}.admin-form textarea{min-height:90px}.full{grid-column:1/-1}.danger{background:#9f2f2f!important}.status-select{border:1px solid #ddd1c9;border-radius:9px;padding:8px}.hidden{display:none}@media(max-width:900px){.admin-grid{grid-template-columns:repeat(2,1fr)}.admin-table{min-width:900px}.admin-panel{overflow:auto}.admin-form{grid-template-columns:1fr}}@media(max-width:520px){.admin-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="promo-bar">ADMIN • CLEAN CUT STORE MANAGEMENT</div>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html">CleanCut<span>Beauty, Simplified.</span></a><nav><a href="index.html">Storefront</a><a href="orders.html">Orders</a><a href="profile.html">Profile</a></nav><button id="admin-logout" class="nav-cta">Logout</button></div></header>
<main class="admin-shell"><div class="admin-head"><div><h1>Store Dashboard</h1><p class="admin-note" id="admin-greeting">Loading admin account…</p></div><button id="refresh-admin" class="add-cart">Refresh data</button></div>
<section class="admin-grid" id="metrics"></section>
<section class="admin-panel"><div class="admin-tabs"><button class="active" data-tab="orders">Orders</button><button data-tab="products">Products</button><button data-tab="customers">Customers</button><button data-tab="add-product">Add product</button></div>
<div id="tab-orders"></div><div id="tab-products" class="hidden"></div><div id="tab-customers" class="hidden"></div>
<div id="tab-add-product" class="hidden"><h2>Add product</h2><form id="product-form" class="admin-form"><input name="name" placeholder="Product name" required><input name="slug" placeholder="product-slug" required><input name="category" placeholder="skincare" required><input name="price" type="number" step="0.01" placeholder="Price" required><input name="old_price" type="number" step="0.01" placeholder="Old price"><input name="tag" placeholder="Bestseller"><input name="image" placeholder="assets/images/product.jpg" required><input name="stock" type="number" min="0" placeholder="Stock" required><input name="reviews" placeholder="0"><input name="rating" type="number" min="0" max="5" step="0.1" placeholder="5"><textarea name="description" class="full" placeholder="Description"></textarea><button class="full" type="submit">Create product</button></form><p id="product-message"></p></div></section></main>
<script src="js/auth.js"></script><script src="js/admin.js"></script></body></html>
