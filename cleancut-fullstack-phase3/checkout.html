<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout — CleanCut</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><div class="container navbar"><a class="logo" href="index.html">CleanCut</a><a href="cart.html">← Back to cart</a></div></header>
<main class="section"><div class="container checkout-layout"><div><div class="page-heading"><span>Secure checkout</span><h1>Complete your order.</h1></div><form class="form-card" id="checkout-form"><h2>Delivery details</h2><input required name="full_name" placeholder="Full name"><input required name="phone" type="tel" placeholder="Phone number"><input required name="address" placeholder="Address"><div class="two-col"><input required name="city" placeholder="City"><input required name="pincode" placeholder="PIN code"></div><h2>Payment</h2><label class="radio"><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label><label class="radio"><input type="radio" name="payment" value="online"> Pay online with Razorpay</label><p class="form-note">Online payments are securely processed by Razorpay. Your card/UPI details never reach this website.</p><button class="btn btn-primary" type="submit">Place order</button></form></div><aside class="summary-card"><h2>Order summary</h2><div id="checkout-summary"></div></aside></div></main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="js/products.js"></script><script src="js/main.js"></script><script src="js/checkout.js"></script>
</body></html>
